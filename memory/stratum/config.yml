# memory/stratum/config.yml
#
# Wiring spec for DevOPs ↔ Stratum integration. As of 2026-05-24, Stratum
# is a single-commit scaffold (see .workflow/state/stratum-audit/ for full
# state). These config fields are SPEC for a backend that doesn't exist;
# no consumer code is wired yet. See docs/LAUNCH_READINESS.md for
# operational state. Per-project overrides go in .workflow/state/stratum.yml.

stratum:
  base_url: ${ANTHROPIC_BASE_URL:-http://localhost:4080}
  api_key_env: STRATUM_API_KEY
  tenant_id_env: STRATUM_TENANT_ID

capture:
  enabled: true
  capture_full_transcripts: true   # phase 0
  capture_token_counts: true

facts:
  auto_extract:
    - function_changes
    - tech_decisions
    - policy_updates
    - todos
  manual_only:
    - variable_changes   # noisy; opt-in

pruning:
  enabled: false   # set true when Stratum Phase 2 ships
  algorithm: cq-extended-kadanedial

billing:
  enabled: true
  hmac_signing: true
  sign_key_env: STRATUM_BILLING_HMAC_KEY

audit:
  git_attestation: true
  conflict_threshold: 0.8   # cosine similarity below which a conflict is logged
