# analyzer/recommendation-rules.yml
#
# Maps detections to recommended components. Read by analyzer/recommend.ts.
# Designed to be extensible — add rules for new stacks here.

universal_baseline:
  skills:
    - process/karpathy-guidelines
    - process/proof-of-work
    - process/baton-handoff
    - process/ask-dont-assume
    - process/spec-extraction
    - process/plan-decomposition
    - process/goal-loop
    - process/surgical-edits
    - process/session-summary
    - process/multi-tool-failover
    - development/ears-spec-writing
    - security/owasp-asi-threat-model
    - security/prompt-injection-defense
    - security/gitleaks-scan
    - security/semgrep-scan
    - devops/observability-instrument
    - devops/cost-attribution
  hooks:
    - universal/pre-tool/block-secrets.sh
    - universal/pre-tool/block-prod-write.sh
    - universal/pre-tool/block-rm-rf.sh
    - universal/pre-tool/budget-brake.sh
    - universal/pre-tool/loop-detection.sh
    - universal/pre-tool/client-boundary.sh
    - universal/post-tool/auto-format.sh
    - universal/post-tool/gitleaks-scan.sh
    - universal/session-start/load-baton.sh
    - universal/session-end/write-baton.sh
  subagents:
    - planner
    - researcher
    - coder
    - tester
    - reviewer
    - security
    - validator

stack_specific:
  - condition: { framework: next.js }
    skills:
      - development/openapi-first
      - stack-specific/nextjs/server-action-safety
    hooks:
      - stack-specific/nextjs/check-route-types.sh
    mcp:
      - playwright

  - condition: { framework: stripe }
    skills:
      - stack-specific/stripe/webhook-idempotency
      - stack-specific/stripe/pci-scope-minimization

  - condition: { framework: fastapi }
    skills:
      - stack-specific/fastapi/dependency-injection
      - development/openapi-first

  - condition: { framework: axum }
    skills:
      - stack-specific/rust/error-handling
      - stack-specific/rust/cargo-audit

  - condition: { database: supabase }
    skills:
      - stack-specific/supabase/rls-policies
      - stack-specific/supabase/rpc-functions

compliance_scope:
  - condition: { compliance_includes: COPPA }
    skills:
      - compliance/coppa-audit
    additional_hooks:
      - universal/pre-tool/redact-pii.sh

  - condition: { compliance_includes: HIPAA }
    skills:
      - compliance/hipaa-audit

  - condition: { compliance_includes: PCI DSS }
    skills:
      - compliance/pci-scope-audit

risk_based:
  - condition: { state: hotfix }
    initial_mode: hotfix
    additional_hooks:
      - universal/pre-tool/scope-creep-block.sh

  - condition: { state: greenfield }
    initial_mode: greenfield
    initial_lifecycle: discovery
