name: devops-stratum-compose

services:
  db:
    image: mirror.gcr.io/supabase/postgres:17.6.1.167@sha256:6942962433a569e87f228b4d4ab7e11db5deca64e43babb3a038443ad6c4f1bb
    container_name: ${DEVOPS_LOCAL_DB_NAME:-devops-stratum-local-db}
    command: ["postgres", "-D", "/etc/postgresql", "-c", "hba_file=/etc/postgresql/pg_hba.local.conf"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./pg_hba.local.conf:/etc/postgresql/pg_hba.local.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [data]

  rest:
    image: mirror.gcr.io/postgrest/postgrest:v16.2@sha256:85258123312dc496ad4c2ed832154a65e9746f84df0d6d09b44229ff9230c08e
    container_name: ${DEVOPS_LOCAL_REST_NAME:-devops-stratum-local-rest}
    environment:
      PGRST_DB_URI: postgresql://authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${DEVOPS_LOCAL_JWT_SECRET:?start through npm run db:start}
    depends_on:
      db:
        condition: service_healthy
    networks: [data, edge]

  gateway:
    image: mirror.gcr.io/library/kong:2.8.1@sha256:1b53405d8680a09d6f44494b7990bf7da2ea43f84a258c59717d4539abf09f6d
    container_name: ${DEVOPS_LOCAL_GATEWAY_NAME:-devops-stratum-local-gateway}
    ports:
      - "127.0.0.1:${DEVOPS_LOCAL_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./kong.local.yml:/etc/kong/kong.yml:ro
    depends_on:
      rest:
        condition: service_started
    networks: [edge]

volumes:
  db-data:

networks:
  data:
    internal: true
  edge:
