name = "startum-proxy"
main = "src/proxy/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CQ_DEFAULT_LAMBDA = "0.97"
CQ_DEFAULT_GAIN_SHIFT = "0.0"
CQ_DEFAULT_THETA = "1.0"
CQ_ARBITRAGE_RATE = "0.20"
CQ_AUDIT_CONFIDENCE_THRESHOLD = "0.85"
CQ_AUDIT_SAMPLE_RATE = "0.10"

# Secrets (set via `wrangler secret put <NAME>`):
# ANTHROPIC_API_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# PINECONE_API_KEY
# CQ_MASTER_ENCRYPTION_KEY
# AWS_NITRO_ENCLAVE_CID

[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["SessionDurableObject"]

[ai]
binding = "AI"

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]

[build]
command = "npm run build"

[dev]
port = 4080
local_protocol = "http"
upstream_protocol = "https"
