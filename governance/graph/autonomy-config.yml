# governance/graph/autonomy-config.yml
#
# Gate-policy documentation for the graph-engineering pipeline.
# The graph hooks/classifier do not load this YAML; REQ-M16 defines their
# finite literal-command policy. The examples below are not an executable parser.
# See governance/graph/role-mapping.md for the human-readable rationale and
# ~/.claude/plans/indexed-launching-cocke.md (outside this repository) for the full approved plan.
#
# hooks/universal/pre-tool/deploy-gate.sh previously read billing_paths from
# THIS file conceptually. The billing_path_change gate and its billing_paths
# list were retired 2026-09-26 (see the "gates:" section below); this
# cross-reference no longer has a list to point at. The hook's billing
# four-eyes check was removed from deploy-gate.sh on the same date; the
# hook's comments record the retirement.

phase: 0  # 0 = pilot (fix SHIP_BLOCKERS.md, full human gate on every step)
          # 1 = inner loop autonomous, deploy gated (billing gate retired
          #     2026-09-26 -- see "gates:" below; billing is no longer a
          #     gate at all, so it is no longer a phase axis either)
          # 2 = low-risk DevOps-core merge-to-main may loosen (never deploy)

roles:
  planner: { subagent: planner, autonomy: full_inner_loop }
  coder: { subagent: coder, autonomy: full_inner_loop }
  tester: { subagent: tester, autonomy: full_inner_loop }
  reviewer: { subagent: reviewer, autonomy: full_inner_loop }
  security: { subagent: security, autonomy: full_inner_loop, never_bypassed: true }
  validator: { subagent: validator, autonomy: full_inner_loop }

parked_subagents:
  - integrations-curator
  - librarian

gates:
  production_deploy:
    approvals_required: 1
    distinct_approvers_required: false
    marker_path_template: ".workflow/state/graph-approvals/{cycle_id}.deploy"
    loosens_in_phase_2: false
    patterns:
      - "vercel .* --prod"
      - "vercel deploy"
      - "wrangler deploy"
      - "npm publish"
      - "git push .* --tags"
      - "git push .* refs/tags/"
      - "git push .* --follow-tags"
      - "git push .* --all"
      - "git push .* tag NAME"
      - "gh release (create|edit|delete|upload)"
      - "supabase db push"
    # Only a bare pushed NAME can use the lookup exception: refs/heads/NAME must
    # exist and refs/tags/NAME must not. A colon refspec requires explicit
    # refs/heads/ on its RHS for ordinary admission; otherwise it remains gated,
    # regardless of a same-named local branch. Explicit protected RHS stays blocked.
    # Tag, both, neither, HEAD and unsafe/unreadable contexts are gated. Git-directory,
    # common-directory and ref metadata must stay inside the project; inherited
    # Git routing/config overrides do not supply lookup authority. See REQ-M16.
    # Select exactly one valid running run.json; environment/current markers
    # are not fallback authority. Unhalted gh pr merge remains exempt (Decision13).
    # Non-force --tags/--follow-tags/--all require deploy approval; the sealed hook
    # does not enumerate their implicit destinations. Forced bulk/mirror ambiguity
    # refuses; an explicit protected RHS still blocks. Not all implicit mutations
    # are mediated by this bounded parser.

  # Billing four-eyes gate retired 2026-09-26 by owner decision (open source, no payment); see ADR-0025.

  merge_to_main:
    phase_0: human_required_every_time
    phase_1: human_required_every_time
    phase_2: auto_allowed_for_low_risk_devops_core_only  # docs, non-production skill/hook edits only; never runtime/

kill_switch:
  halt_file: ".workflow/state/graph-halt"
  commands: ["/graph-halt", "/graph-resume"]
  checked_by: "hooks/universal/pre-tool/deploy-gate.sh"
  # Covers recognized consequential Bash forms before deploy-only admission,
  # including release/database/ref mutations and gh pr merge while halted.
  # Ordinary diagnostics/inert text stay available; a marker cannot override
  # halt. This does not cancel an existing child or gate every tool/program.

resilience:
  preflight: "scripts/graph-preflight.sh"
  remediation_registry: "governance/graph/preflight-remediations.yml"
  blocked_record: ".workflow/state/blocked.md"
  run_record: ".workflow/state/graph-cycles/{cycleId}/run.json"
  unattended_resume_classes: [api, transient]

# SUPERSEDED IN PART 2026-09-26: every statement below about
# gates.billing_path_change specifically -- that it was "required," that
# the recommendation was to "KEEP both gates permanently," and that it does
# "not have an entry-criteria path to loosening... reopening them requires a
# new, separately-reasoned decision" -- no longer holds for billing. The
# owner's 2026-09-26 decision to retire the billing four-eyes gate (open
# source, no payment; see the "gates:" section above and ADR-0025) IS
# that new, separately-reasoned decision this block itself said reopening
# would require. Nothing below is deleted or reworded; it is left intact as
# the historical record of what was decided on 2026-09-14. The
# gates.production_deploy half of that record is NOT superseded and still
# stands unchanged.
# RESOLVED 2026-09-14: the "separate explicit decision" gates.production_deploy
# and gates.billing_path_change required has been made. User deferred to
# recommendation ("for all questions I will go by your best recommendation");
# recommendation is KEEP both gates permanently -- see the "RESOLVED" section
# at the top of ~/.claude/plans/indexed-launching-cocke.md (outside this repository) for full reasoning.
# This is not provisional: phase_2_entry_criteria below governs
# merge_to_main.phase_2 ONLY. production_deploy and billing_path_change do
# not have an entry-criteria path to loosening at all anymore -- reopening
# them requires a new, separately-reasoned decision, not accumulated clean
# cycles.
production_autonomy_decision:
  status: resolved
  decision: gates_stay_permanent
  decided: "2026-09-14"
  decided_by: "user, deferred to model recommendation"
  # ^ This status/decision/decided/decided_by record is left byte-for-byte as
  #   decided on 2026-09-14, when it covered both gates. As of 2026-09-26,
  #   "gates_stay_permanent" no longer holds for gates.billing_path_change
  #   (retired that day; removed from gates: above) -- it holds only for
  #   gates.production_deploy, which this change does not touch.

phase_2_entry_criteria:
  # ALL must hold before Phase 2 is even considered -- and even then, only
  # merge_to_main.phase_2 loosens. production_deploy stays human-required
  # permanently (see production_autonomy_decision above). billing_path_change
  # is no longer a gate at all (retired 2026-09-26, see gates: above), so
  # there is nothing left here for it to stay permanent as.
  min_clean_phase_1_cycles: null  # to be set with the user before Phase 1 starts
  claim_validator_pass_rate_healthy: null  # target set once Phase 0 restores it
  change_failure_rate: steady_or_improving
  mean_time_to_recovery: steady_or_improving

audit:
  every_graph_action_logged_to: ".workflow/state/events.jsonl"
  tied_to_claim_validator: true
