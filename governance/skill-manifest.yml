# governance/skill-manifest.yml
#
# Phase 2 area E: cryptographic provenance manifest for every universal skill.
# Per spec phase-2/E-sigstore-signing.md REQ-E2: every skill entry carries
# name, path, sha256, sig_path, signed_by, signed_at, rekor_log_index, and
# signed_with_version. The signature-related fields are placeholders until
# the first signing run (E.04 via .github/workflows/release-sign.yml) fills
# them via the cosign keyless OIDC flow.
#
# Schema:
#   skills:
#     - name: <slug, matches the parent directory name>
#       path: <repo-relative path to the SKILL.md>
#       sha256: <sha256 of the SKILL.md content, lowercase hex>
#       sig_path: <repo-relative path the .sig file WILL hold post-signing>
#       signed_by: <Sigstore identity that produced the signature; placeholder
#                   until first release-sign.yml run>
#       signed_at: <ISO 8601 UTC timestamp of the signing; placeholder>
#       rekor_log_index: <Rekor transparency log index for the entry;
#                          placeholder>
#       signed_with_version: <cosign version pinned in release-sign.yml at
#                              signing time; placeholder>
#
# Lifecycle:
#   - sha256 is computed at manifest-author time + recomputed on every CI
#     run to detect drift between SKILL.md content and the manifest entry.
#   - sig_path is a stable string from the start (the directory layout is
#     known); the actual .sig file lands at that path post-signing.
#   - signed_by / signed_at / rekor_log_index / signed_with_version are
#     populated by the release-sign.yml workflow on its first successful
#     run (E.04). A future run that re-signs a changed skill updates the
#     entry in-place.
#
# AST08 defense: any modification to a SKILL.md without a corresponding
# manifest re-sign would mismatch the recorded sha256, which the verifier
# (analyzer/install.ts area F) refuses to install.

