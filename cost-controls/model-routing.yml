# cost-controls/model-routing.yml
#
# 2026-09-14 (user directive): the main session is the orchestrator ("boss/CTO" -- the
# main Claude Code session running sprint-cycle.js, which the user selects
# via /model); all graph-engineering subagents route to Sonnet at MAX
# reasoning effort for workflow runs (`model: 'sonnet', effort: 'max'` per
# agent() call; the preflight agent runs at effort low). See
# governance/graph/role-mapping.md for the role spec.
#
# Mechanical note: this file is NOT self-enforcing. The main session's model
# (intended: Claude Opus 5.5) is chosen by the user via /model -- no config file can
# switch a running session's own model. Subagent routing IS enforced, via
# explicit `model:` options on each agent() call in
# .claude/workflows/sprint-cycle.js.

models:
  haiku:
    id: claude-haiku-4-5-20251001
    cost_per_mtok_input_usd: 1.00
    cost_per_mtok_output_usd: 5.00
    context_window: 200000
    use_for:
      - not currently used by graph subagent routing (kept for reference/override)

  sonnet:
    id: claude-sonnet-5
    cost_per_mtok_input_usd: 2.00
    cost_per_mtok_output_usd: 10.00
    context_window: 1000000
    use_for:
      - all graph-engineering subagent roles (planner/coder/tester/reviewer/security/validator) in workflow runs, at effort max

  opus:
    id: claude-opus-5
    cost_per_mtok_input_usd: 5.00
    cost_per_mtok_output_usd: 25.00
    context_window: 1000000
    use_for:
      - not currently used by graph subagent routing (kept for reference/override)

  opus-5-5:
    id: claude-opus-5-5
    cost_per_mtok_input_usd: 4.00
    cost_per_mtok_output_usd: 20.00
    context_window: 1000000
    use_for:
      - orchestrator ("boss/CTO") -- the top-level session running sprint-cycle.js; selected by the user via /model for the main session, not set by this file

  fable:
    id: claude-fable-5-1
    use_for:
      - not currently used by graph routing (kept for reference/override)

# Subagent routing -- all Sonnet at effort max, per user directive 2026-09-14
subagent_effort: max
subagents:
  planner: sonnet
  coder: sonnet
  tester: sonnet
  reviewer: sonnet
  security: sonnet
  validator: sonnet

orchestrator: opus-5-5   # the main session; see mechanical note above -- documentation, not enforcement

# Advisor strategy retired 2026-09-14: with all subagent roles on a single
# tier (sonnet), a plan/implement/review model split no longer applies. Left
# here, disabled, for history -- delete once nobody needs the old context.
advisor_strategy:
  enabled: false

# The batch_api and prompt_caching blocks below are recommendations for code
# that calls the Messages API directly, not a configured mechanism: no code
# reads or applies them.

# Batch API (50% discount for non-real-time work)
batch_api:
  recommended: true
  use_for:
    - security scans
    - documentation generation
    - eval runs
    - cost reports
    - test data generation

# Prompt caching (constitution layer is the ideal cache candidate)
prompt_caching:
  cache_constitution: true
  cache_agents_md: true
  cache_skill_metadata: true
  ttl_minutes: 60
