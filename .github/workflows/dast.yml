name: Local DAST

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Registry/network hiccups are the main CI flake source: every npm call retries.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '60000'

jobs:
  dast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DAST_TARGET: http://127.0.0.1:18080/docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Prepare fixed DAST assets
        run: node scripts/prepare-dast.mjs
      - name: Scan the isolated application
        run: node scripts/run-dast.mjs
      - name: Recover only this run's owned resources
        if: always()
        run: node --input-type=module -e "import { cleanupCurrentRun } from './scripts/run-dast.mjs'; import { cleanupPreparing } from './scripts/prepare-dast.mjs'; const preparation = await cleanupPreparing(); const run = await cleanupCurrentRun(); process.stdout.write(JSON.stringify({preparation,run}) + '\n'); if (!preparation.complete || !run.complete) process.exitCode = 1;"
      - name: Upload synthetic DAST evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-dast-evidence
          path: .workflow/proofs/dast/
          include-hidden-files: true
          if-no-files-found: error
