name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  setup-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - name: Cold checkout to local proxy and database
        run: |
          test ! -d stratum/node_modules
          if docker volume inspect devops-stratum-compose_db-data >/dev/null 2>&1; then
            echo "The project database volume already exists on this runner" >&2
            exit 1
          fi
          started_at=$(date +%s)
          npm run setup
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "Linux cold setup completed in ${elapsed_seconds}s"
          test "$elapsed_seconds" -lt 300
      - name: Stop disposable local stack
        if: always()
        run: DEVOPS_LOCAL_JWT_SECRET=cleanup docker compose -f stratum/supabase/docker-compose.local.yml -p devops-stratum-compose down

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - run: npm install -g tsx
      - name: Validate all claims
        run: tsx verification/claim-validator.ts --all --no-rerun
        # Note: --no-rerun in CI; full --rerun in pre-merge gate
      - name: Check stale proofs
        run: tsx verification/stale-proof-detector.ts
      - name: Lint Renovate template (REQ-H1..H6)
        run: npm run lint:renovate
      - name: Lint stack-specific skills (REQ-D2..D7)
        run: npm run lint:stack-specific-skills
      - name: Test dashboard and test hermeticity (REQ-R12..R13)
        # Preflight checks these directories; they do not require installed packages.
        # Security-tool versions are supplied by the isolated test fixtures.
        run: |
          mkdir -p node_modules/.bin stratum/node_modules/.bin .workflow/proofs
          npm test
