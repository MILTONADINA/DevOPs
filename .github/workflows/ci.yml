name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  setup-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - name: Cold checkout to local proxy and database
        run: |
          test ! -d stratum/node_modules
          if docker volume inspect devops-stratum-compose_db-data >/dev/null 2>&1; then
            echo "The project database volume already exists on this runner" >&2
            exit 1
          fi
          started_at=$(date +%s)
          npm run setup
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "Linux cold setup completed in ${elapsed_seconds}s"
          test "$elapsed_seconds" -lt 300
      - name: SQL integration tests (specs/ops/ci-product-suites.md REQ-2)
        run: |
          shopt -s nullglob
          files=(stratum/test/integration/*.sql)
          test "${#files[@]}" -gt 0 || { echo "no SQL integration tests found" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker exec -i devops-stratum-local-db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < "$f"
            echo "::endgroup::"
          done
          echo "${#files[@]} SQL integration test files passed"
      - name: Stop disposable local stack
        if: always()
        run: DEVOPS_LOCAL_JWT_SECRET=cleanup docker compose -f stratum/supabase/docker-compose.local.yml -p devops-stratum-compose down

  stratum-test:
    # specs/ops/ci-product-suites.md REQ-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stratum
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - name: npm test, held to its floor (masterpiece REQ-M23)
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/stratum-tests.log"
          node ../scripts/check-test-floor.mjs stratum "$RUNNER_TEMP/stratum-tests.log"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - run: npm install -g tsx
      - name: Validate all claims
        run: tsx verification/claim-validator.ts --all --no-rerun
        # --no-rerun: re-running proofs needs the local environment. .workflow/proofs/ is
        # gitignored, so on a CI checkout this finds no claims and passes (PB-60).
      - name: Check stale proofs
        run: tsx verification/stale-proof-detector.ts
      - name: Lint Renovate template (REQ-H1..H6)
        run: npm run lint:renovate
      - name: Lint stack-specific skills (REQ-D2..D7)
        run: npm run lint:stack-specific-skills
      - name: Test dashboard and test hermeticity (REQ-R12..R13), held to its floor (REQ-M23)
        shell: bash
        # Preflight checks these directories; they do not require installed packages.
        # Security-tool versions are supplied by the isolated test fixtures.
        run: |
          mkdir -p node_modules/.bin stratum/node_modules/.bin .workflow/proofs
          npm test 2>&1 | tee "$RUNNER_TEMP/root-tests.log"
          node scripts/check-test-floor.mjs root "$RUNNER_TEMP/root-tests.log"
      - name: Test floors only rise; added test files assert (masterpiece REQ-M23)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:governance/test-floors.json > "$RUNNER_TEMP/base-floors.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-floors.json"
          node scripts/check-test-floor.mjs --ratchet "$RUNNER_TEMP/base-floors.json"
          mapfile -t added < <(git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- 'tests/**/*.test.mjs' 'stratum/test/**/*.test.ts')
          if [ "${#added[@]}" -gt 0 ]; then node scripts/check-assertions.mjs "${added[@]}"; else echo "check-assertions: no test files added"; fi
