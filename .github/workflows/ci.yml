name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - name: Cold checkout to local proxy and database
        run: |
          test ! -d runtime/node_modules
          if docker volume inspect devops-stratum-compose_db-data >/dev/null 2>&1; then
            echo "The project database volume already exists on this runner" >&2
            exit 1
          fi
          started_at=$(date +%s)
          npm run setup
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "Linux cold setup completed in ${elapsed_seconds}s"
          test "$elapsed_seconds" -lt 300
      - name: SQL integration tests (specs/ops/ci-product-suites.md REQ-2)
        run: |
          shopt -s nullglob
          files=(runtime/test/integration/*.sql)
          test "${#files[@]}" -gt 0 || { echo "no SQL integration tests found" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker exec -i devops-stratum-local-db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < "$f"
            echo "::endgroup::"
          done
          echo "${#files[@]} SQL integration test files passed"
      - name: Stop disposable local stack
        if: always()
        run: DEVOPS_LOCAL_JWT_SECRET=cleanup docker compose -f runtime/supabase/docker-compose.local.yml -p devops-stratum-compose down

  runtime-test:
    # specs/ops/ci-product-suites.md REQ-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: npm test, held to its floor (masterpiece REQ-M23)
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"
          node ../scripts/check-test-floor.mjs runtime "$RUNNER_TEMP/runtime-tests.log"

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      # tsx comes from the root lockfile, never from an unpinned global install. The
      # reproducibility-check tests and the claim steps below run it.
      - run: npm ci
      - name: Detector prompt and fingerprint lint (masterpiece REQ-M25)
        run: node scripts/lint-detector-prompts.mjs
      - name: Test dashboard and test hermeticity (REQ-R12..R13), held to its floor (REQ-M23)
        shell: bash
        # The suite brings its own fixtures; local ignored proofs are not a prerequisite.
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/root-tests.log"
          node scripts/check-test-floor.mjs root "$RUNNER_TEMP/root-tests.log"
      - name: Test floors only rise (or fall by a declared lowering); added test files assert (masterpiece REQ-M23)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git show FETCH_HEAD:governance/test-floors.json > "$RUNNER_TEMP/base-floors.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-floors.json"
          node scripts/check-test-floor.mjs --ratchet "$RUNNER_TEMP/base-floors.json"
          mapfile -t added < <(git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- ':(glob)tests/**/*.test.mjs' ':(glob)runtime/test/**/*.test.ts')
          if [ "${#added[@]}" -gt 0 ]; then node scripts/check-assertions.mjs "${added[@]}"; else echo "check-assertions: no test files added"; fi
      - name: Spec status lint (masterpiece REQ-M8; quality plan MR-11(A))
        run: node scripts/lint-spec-status.mjs
      - name: Repository hygiene (specs/ops/repo-hygiene.md; quality plan QW-9)
        run: node scripts/check-repo-hygiene.mjs
      - name: Spec-status baseline only shrinks (quality plan MR-11(A))
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git show FETCH_HEAD:governance/traceability-baseline.json > "$RUNNER_TEMP/base-traceability.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-traceability.json"
          node scripts/lint-spec-status.mjs --ratchet "$RUNNER_TEMP/base-traceability.json"
      - name: Prepare committed-claim ancestry authority
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Prepare checkout residue for committed claims
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = Buffer.from('[core]\n\tsparseCheckout = false\n\tsparseCheckoutCone = false\n[index]\n\tsparse = false\n');
          const fail = () => { throw new Error(); };
          const same = (a, b) => a.dev === b.dev && a.ino === b.ino &&
            a.size === b.size && a.mtimeNs === b.mtimeNs && a.ctimeNs === b.ctimeNs &&
            a.mode === b.mode && a.nlink === b.nlink;
          function readRegular(file, cap) {
            const before = fs.lstatSync(file, { bigint: true });
            if (!before.isFile() || before.nlink !== 1n || before.size > BigInt(cap)) fail();
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
              if (!same(before, fs.fstatSync(fd, { bigint: true }))) fail();
              const buffer = Buffer.alloc(cap + 1);
              let used = 0;
              while (used < buffer.length) {
                const count = fs.readSync(fd, buffer, used, buffer.length - used, used);
                if (count === 0) break;
                used += count;
              }
              if (used > cap || BigInt(used) !== before.size ||
                  !same(before, fs.fstatSync(fd, { bigint: true })) ||
                  !same(before, fs.lstatSync(file, { bigint: true }))) fail();
              return { bytes: buffer.subarray(0, used), stat: before };
            } finally {
              if (fd !== undefined) fs.closeSync(fd);
            }
          }
          function prepare() {
            const root = process.cwd();
            if (fs.realpathSync(root) !== root) fail();
            const git = path.join(root, '.git');
            const directory = fs.lstatSync(git, { bigint: true });
            if (!directory.isDirectory() || directory.isSymbolicLink()) fail();
            const residue = path.join(git, 'config.worktree');
            try { fs.lstatSync(residue); }
            catch (error) {
              if (error.code !== 'ENOENT') throw error;
              console.log('checkout residue: absent');
              return;
            }
            const worktree = readRegular(residue, 83);
            if (!worktree.bytes.equals(expected)) fail();
            const configPath = path.join(git, 'config');
            const config = readRegular(configPath, 65536);
            const text = new TextDecoder('utf-8', { fatal: true }).decode(config.bytes);
            if (text.includes('\0') || /\\(?:\r?\n|$)/.test(text)) fail();
            for (const raw of text.split('\n')) {
              const line = raw.trim();
              if (!line.startsWith('[')) continue;
              const header = /^\[([A-Za-z][A-Za-z0-9-]*(?:\.[A-Za-z0-9_.:/-]+)?)(?:[ \t]+"[^"\\\x00-\x1f]*")?\][ \t]*(?:[#;].*)?$/.exec(line);
              if (!header || ['include', 'includeif', 'extensions'].includes(header[1].split('.')[0].toLowerCase())) fail();
            }
            if (!same(directory, fs.lstatSync(git, { bigint: true })) ||
                !same(config.stat, fs.lstatSync(configPath, { bigint: true })) ||
                !same(worktree.stat, fs.lstatSync(residue, { bigint: true }))) fail();
            fs.unlinkSync(residue);
            console.log('checkout residue: removed known inactive settings');
          }
          try { prepare(); }
          catch {
            console.error('checkout residue: unavailable or unsupported');
            process.exitCode = 1;
          }
          NODE
      - name: Validate committed claim metadata
        run: npx --no-install tsx verification/claim-validator.ts --all --no-rerun
        # Strict nonempty publication at HEAD; logs and command execution are not observed.
      - name: Lint Renovate template (REQ-H1..H6)
        run: npm run lint:renovate
      - name: Lint stack-specific skills (REQ-D2..D7)
        run: npm run lint:stack-specific-skills

  node-compat:
    # The required jobs run on Node 22, the supported floor (engines >=22.12.0). This job
    # runs the same suites on the newer supported majors. It is not a required check.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Root tests
        run: |
          npm ci
          npm test
      - name: Runtime typecheck and tests
        working-directory: runtime
        run: |
          npm ci
          npm run typecheck
          npm test
