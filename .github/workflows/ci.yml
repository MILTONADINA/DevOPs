name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - name: Cold checkout to local proxy and database
        run: |
          test ! -d runtime/node_modules
          if docker volume inspect devops-stratum-compose_db-data >/dev/null 2>&1; then
            echo "The project database volume already exists on this runner" >&2
            exit 1
          fi
          started_at=$(date +%s)
          npm run setup
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "Linux cold setup completed in ${elapsed_seconds}s"
          test "$elapsed_seconds" -lt 300
      - name: SQL integration tests (specs/ops/ci-product-suites.md REQ-2)
        run: |
          shopt -s nullglob
          files=(runtime/test/integration/*.sql)
          test "${#files[@]}" -gt 0 || { echo "no SQL integration tests found" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker exec -i devops-stratum-local-db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < "$f"
            echo "::endgroup::"
          done
          echo "${#files[@]} SQL integration test files passed"
      - name: Stop disposable local stack
        if: always()
        run: DEVOPS_LOCAL_JWT_SECRET=cleanup docker compose -f runtime/supabase/docker-compose.local.yml -p devops-stratum-compose down

  runtime-test:
    # specs/ops/ci-product-suites.md REQ-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: npm test, held to its floor (masterpiece REQ-M23)
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"
          node ../scripts/check-test-floor.mjs runtime "$RUNNER_TEMP/runtime-tests.log"

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: 22 }
      # tsx comes from the root lockfile, never from an unpinned global install. The
      # reproducibility-check tests and the claim steps below run it.
      - run: npm ci
      - name: Enforcement references resolve (masterpiece REQ-M20)
        run: node scripts/check-enforcement.mjs
      - name: Prepare enforcement baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';

          const INTRODUCTION_BASE_SHA = '98648cfc6710a80444943165ab7dcd2c80f86210';
          const base = process.env.BASE_SHA; // Capture once; never resolve a mutable ref.
          const baseline = 'governance/enforcement-baseline.json';
          const cap = 1024 * 1024;
          function requireValue(ok) { if (!ok) throw new Error('unavailable'); }

          try {
            requireValue(typeof base === 'string' && base.length === 40 && /^[0-9a-f]{40}$/.test(base));
            const root = process.cwd();
            requireValue(fs.realpathSync(root) === root);
            const gitDir = path.join(root, '.git');
            requireValue(fs.lstatSync(gitDir).isDirectory());
            // Actions owns this ordinary checkout's Git metadata. This is not a general
            // hostile-repository reader; no caller command, config path or ref is accepted.
            const env = {
              PATH: '/usr/bin:/bin', HOME: root, XDG_CONFIG_HOME: root, LANG: 'C', LC_ALL: 'C',
              GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null',
              GIT_NO_REPLACE_OBJECTS: '1', GIT_NO_LAZY_FETCH: '1',
              GIT_TERMINAL_PROMPT: '0', GIT_OPTIONAL_LOCKS: '0',
              GIT_ATTR_NOSYSTEM: '1', GIT_ALLOW_PROTOCOL: '',
            };
            const prefix = ['--no-pager', '--no-replace-objects', '--literal-pathspecs',
              `--git-dir=${gitDir}`, `--work-tree=${root}`, '-c', 'protocol.allow=never',
              '-c', 'core.fsmonitor=false', '-c', 'core.attributesFile=/dev/null'];
            function git(args, maximum) {
              const result = spawnSync('/usr/bin/git', [...prefix, ...args], {
                cwd: root, env, input: Buffer.alloc(0), encoding: 'buffer',
                timeout: 5000, killSignal: 'SIGKILL', maxBuffer: maximum,
              });
              requireValue(!result.error && result.status === 0 && result.signal === null &&
                Buffer.isBuffer(result.stdout) && result.stdout.length <= maximum &&
                Buffer.isBuffer(result.stderr) && result.stderr.length <= maximum);
              return result.stdout;
            }

            // Every in-root output parent must be an ordinary directory. Never use a
            // recursive mkdir that could silently traverse an existing symbolic link.
            let parent = root;
            for (const component of ['.workflow', 'state']) {
              parent = path.join(parent, component);
              try { fs.mkdirSync(parent, { mode: 0o700 }); }
              catch (error) { if (error.code !== 'EEXIST') throw error; }
              requireValue(fs.lstatSync(parent).isDirectory());
            }
            const target = path.join(parent, 'enforcement-base.json');
            let exists = false;
            try { fs.lstatSync(target); exists = true; }
            catch (error) { if (error.code !== 'ENOENT') throw error; }
            requireValue(!exists);

            requireValue(git(['cat-file', '-t', base], 64).equals(Buffer.from('commit\n')));
            const tree = git(['ls-tree', '-z', base, '--', baseline], 4096);
            let bytes;
            if (tree.length === 0) {
              requireValue(base === INTRODUCTION_BASE_SHA);
              bytes = Buffer.from('{"schema_version":1,"enforced":[]}\n');
            } else {
              // Buffer round-trip prevents lossy decoding from admitting malformed bytes.
              const text = tree.toString('utf8');
              requireValue(Buffer.from(text).equals(tree));
              const entry = /^100644 blob ([0-9a-f]{40})\tgovernance\/enforcement-baseline\.json\0$/.exec(text);
              requireValue(entry !== null && entry[0].length === text.length);
              const oid = entry[1];
              const sizeBytes = git(['cat-file', '-s', oid], 64);
              const sizeText = sizeBytes.toString('ascii');
              const sizeMatch = /^(0|[1-9][0-9]*)\n$/.exec(sizeText);
              requireValue(Buffer.from(sizeText, 'ascii').equals(sizeBytes) &&
                sizeMatch !== null && sizeMatch[0].length === sizeText.length);
              const size = Number(sizeText.trim());
              requireValue(Number.isSafeInteger(size) && size >= 0 && size <= cap);
              bytes = git(['cat-file', 'blob', oid], cap + 1);
              requireValue(bytes.length === size && bytes.length <= cap);
              const actual = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              requireValue(actual === oid);
            }

            let fd;
            try {
              fd = fs.openSync(target, fs.constants.O_WRONLY | fs.constants.O_CREAT |
                fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
              const state = fs.fstatSync(fd);
              requireValue(state.isFile() && state.nlink === 1);
              fs.writeFileSync(fd, bytes);
              fs.fsyncSync(fd);
            } finally { if (fd !== undefined) fs.closeSync(fd); }
            process.stdout.write('enforcement baseline: prepared\n');
          } catch {
            process.stderr.write('enforcement baseline: unavailable\n');
            process.exitCode = 1;
          }
          NODE
      - name: Mechanical enforcement references cannot regress (masterpiece REQ-M20)
        if: github.event_name == 'pull_request'
        run: node scripts/check-enforcement.mjs --ratchet .workflow/state/enforcement-base.json
      - name: Detector prompt and fingerprint lint (masterpiece REQ-M25)
        run: node scripts/lint-detector-prompts.mjs
      - name: Test dashboard and test hermeticity (REQ-R12..R13), held to its floor (REQ-M23)
        shell: bash
        # The suite brings its own fixtures; local ignored proofs are not a prerequisite.
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/root-tests.log"
          node scripts/check-test-floor.mjs root "$RUNNER_TEMP/root-tests.log"
      - name: Test floors only rise (or fall by a declared lowering); added test files assert (masterpiece REQ-M23)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git show FETCH_HEAD:governance/test-floors.json > "$RUNNER_TEMP/base-floors.json" 2>/dev/null
          node scripts/check-test-floor.mjs --ratchet "$RUNNER_TEMP/base-floors.json"
          git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- ':(glob)tests/**/*.test.mjs' ':(glob)runtime/test/**/*.test.ts' > "$RUNNER_TEMP/added-tests.txt"
          mapfile -t added < "$RUNNER_TEMP/added-tests.txt"
          if [ "${#added[@]}" -gt 0 ]; then node scripts/check-assertions.mjs "${added[@]}"; else echo "check-assertions: no test files added"; fi
      - name: Spec status lint (masterpiece REQ-M8; quality plan MR-11(A))
        run: node scripts/lint-spec-status.mjs
      - name: Repository hygiene (specs/ops/repo-hygiene.md; quality plan QW-9)
        run: node scripts/check-repo-hygiene.mjs
      - name: Spec-status baseline only shrinks (quality plan MR-11(A))
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git show FETCH_HEAD:governance/traceability-baseline.json > "$RUNNER_TEMP/base-traceability.json" 2>/dev/null
          node scripts/lint-spec-status.mjs --ratchet "$RUNNER_TEMP/base-traceability.json"
      - name: Prepare committed-claim ancestry authority
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Prepare checkout residue for committed claims
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = Buffer.from('[core]\n\tsparseCheckout = false\n\tsparseCheckoutCone = false\n[index]\n\tsparse = false\n');
          const fail = () => { throw new Error(); };
          const same = (a, b) => a.dev === b.dev && a.ino === b.ino &&
            a.size === b.size && a.mtimeNs === b.mtimeNs && a.ctimeNs === b.ctimeNs &&
            a.mode === b.mode && a.nlink === b.nlink;
          function readRegular(file, cap) {
            const before = fs.lstatSync(file, { bigint: true });
            if (!before.isFile() || before.nlink !== 1n || before.size > BigInt(cap)) fail();
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
              if (!same(before, fs.fstatSync(fd, { bigint: true }))) fail();
              const buffer = Buffer.alloc(cap + 1);
              let used = 0;
              while (used < buffer.length) {
                const count = fs.readSync(fd, buffer, used, buffer.length - used, used);
                if (count === 0) break;
                used += count;
              }
              if (used > cap || BigInt(used) !== before.size ||
                  !same(before, fs.fstatSync(fd, { bigint: true })) ||
                  !same(before, fs.lstatSync(file, { bigint: true }))) fail();
              return { bytes: buffer.subarray(0, used), stat: before };
            } finally {
              if (fd !== undefined) fs.closeSync(fd);
            }
          }
          function prepare() {
            const root = process.cwd();
            if (fs.realpathSync(root) !== root) fail();
            const git = path.join(root, '.git');
            const directory = fs.lstatSync(git, { bigint: true });
            if (!directory.isDirectory() || directory.isSymbolicLink()) fail();
            const residue = path.join(git, 'config.worktree');
            try { fs.lstatSync(residue); }
            catch (error) {
              if (error.code !== 'ENOENT') throw error;
              console.log('checkout residue: absent');
              return;
            }
            const worktree = readRegular(residue, 83);
            if (!worktree.bytes.equals(expected)) fail();
            const configPath = path.join(git, 'config');
            const config = readRegular(configPath, 65536);
            const text = new TextDecoder('utf-8', { fatal: true }).decode(config.bytes);
            if (text.includes('\0') || /\\(?:\r?\n|$)/.test(text)) fail();
            for (const raw of text.split('\n')) {
              const line = raw.trim();
              if (!line.startsWith('[')) continue;
              const header = /^\[([A-Za-z][A-Za-z0-9-]*(?:\.[A-Za-z0-9_.:/-]+)?)(?:[ \t]+"[^"\\\x00-\x1f]*")?\][ \t]*(?:[#;].*)?$/.exec(line);
              if (!header || ['include', 'includeif', 'extensions'].includes(header[1].split('.')[0].toLowerCase())) fail();
            }
            if (!same(directory, fs.lstatSync(git, { bigint: true })) ||
                !same(config.stat, fs.lstatSync(configPath, { bigint: true })) ||
                !same(worktree.stat, fs.lstatSync(residue, { bigint: true }))) fail();
            fs.unlinkSync(residue);
            console.log('checkout residue: removed known inactive settings');
          }
          try { prepare(); }
          catch {
            console.error('checkout residue: unavailable or unsupported');
            process.exitCode = 1;
          }
          NODE
      - name: Validate committed claim metadata
        run: npx --no-install tsx verification/claim-validator.ts --all --no-rerun
        # Strict nonempty publication at HEAD; logs and command execution are not observed.
      - name: Validate closure citations (specs/graph/closure-references.md REQ-6)
        run: npx --no-install tsx scripts/lint-closures.mjs
      - name: Lint Renovate template (REQ-H1..H6)
        run: npm run lint:renovate
      - name: Lint stack-specific skills (REQ-D2..D7)
        run: npm run lint:stack-specific-skills

  node-compat:
    # The required jobs run on Node 22, the supported floor (engines >=22.12.0). This job
    # runs the same suites on the newer supported majors. It is not a required check.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Root tests
        run: |
          npm ci
          npm test
      - name: Runtime typecheck and tests
        working-directory: runtime
        run: |
          npm ci
          npm run typecheck
          npm test
