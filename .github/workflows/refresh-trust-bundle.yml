name: Refresh Sigstore trust bundle

# Phase 2 area E / E.05 -- weekly refresh of the cached Sigstore
# root-of-trust at .workflow/sigstore/trust-bundle.json. The cached
# bundle is what offline-verification consumers (e.g., analyzer/install.ts
# from area F) use to verify signatures without internet access.
# Weekly cadence per docs/SKILL_SIGNING.md; Sigstore's root-of-trust
# rotation is historically low-frequency, but the bundle should track
# it. Operators wanting tighter freshness can shorten the cron.
#
# Auto-PR on change: if the upstream bundle has changed since the last
# refresh, this workflow opens a PR to commit the updated bundle. A
# reviewer can spot-check the diff (rare in practice but worth the
# human gate) before merging.
#
# AST08 defense: tag-pinned actions throughout. SHAs verified via
# git ls-remote pattern from session 5 + B.10 sweep.

on:
  schedule:
    # Weekly Monday 06:00 UTC. Stays clear of typical PR-merge windows.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Install cosign (same pin as release-sign.yml's E.06)
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
        with:
          cosign-release: 'v2.4.3'

      - name: Download latest Sigstore trust root (TUF-verified)
        # SECURITY: tuf-repo-cdn.sigstore.dev now serves TUF
        # consistent-snapshot targets, so `targets/trusted_root.json` no
        # longer exists as a static path -- targets are only published
        # content-addressed as `targets/<sha256-of-file>.trusted_root.json`.
        #
        # A prior version of this step worked around that by curling
        # `trusted_root.json` from `sigstore/root-signing`'s `main` branch
        # directly, with NO verification. That defeats the entire point of
        # a trust root: `main` is a mutable ref, so a compromised branch
        # (or a compromised/MITM'd raw.githubusercontent.com response)
        # would inject a forged root, and every downstream signature check
        # in this repo (skill signing included) would then trust forged
        # signatures. Flagged by automated security review before merge --
        # do not reintroduce an unverified fetch here.
        #
        # Correct fix: `cosign initialize` performs full TUF client
        # verification (root -> timestamp -> snapshot -> targets, each
        # signature-checked against cosign's embedded Sigstore root of
        # trust) and caches the verified, current targets locally --
        # including trusted_root.json -- so we never hand-roll TUF
        # ourselves or trust an unverified fetch.
        run: |
          set -euo pipefail
          cosign initialize

          FOUND="$(find "$HOME/.sigstore" -type f -name 'trusted_root.json' -print -quit)"
          if [[ -z "$FOUND" ]]; then
            echo "FAIL: cosign initialize did not produce a trusted_root.json under \$HOME/.sigstore -- refusing to write an unverified/missing trust bundle." >&2
            exit 1
          fi
          if [[ ! -s "$FOUND" ]]; then
            echo "FAIL: $FOUND exists but is empty." >&2
            exit 1
          fi

          mkdir -p .workflow/sigstore
          cp "$FOUND" .workflow/sigstore/trust-bundle.json
          echo "Trust bundle refreshed from TUF-verified $FOUND"

      - name: Check for drift
        id: drift
        run: |
          set -euo pipefail
          if git diff --quiet .workflow/sigstore/trust-bundle.json; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            echo "Trust bundle unchanged -- no PR needed."
          else
            echo "no_change=false" >> "$GITHUB_OUTPUT"
            echo "Trust bundle changed -- opening PR."
          fi

      - name: Open PR with refreshed trust bundle
        if: steps.drift.outputs.no_change == 'false'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-trust-bundle
          title: 'chore(sigstore): refresh trust-bundle.json (weekly cadence)'
          body: |
            Automated refresh of `.workflow/sigstore/trust-bundle.json`,
            fetched via `cosign initialize` (full TUF client verification
            against cosign's embedded Sigstore root of trust -- not a raw,
            unverified fetch).

            Per `docs/SKILL_SIGNING.md` E.05 weekly refresh cadence.
            Spot-check the diff against the upstream Sigstore TUF
            repository before merging.
          commit-message: 'chore(sigstore): refresh trust-bundle.json'
          delete-branch: true
