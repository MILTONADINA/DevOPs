name: Refresh Sigstore trust bundle

# Phase 2 area E / E.05 -- weekly refresh of the cached Sigstore
# root-of-trust at .workflow/sigstore/trust-bundle.json. The cached
# bundle is what offline-verification consumers (e.g., analyzer/install.ts
# from area F) use to verify signatures without internet access.
# Weekly cadence per docs/SKILL_SIGNING.md; Sigstore's root-of-trust
# rotation is historically low-frequency, but the bundle should track
# it. Operators wanting tighter freshness can shorten the cron.
#
# On change: no bot branches (owner decision 2026-09-26). If the upstream
# bundle changed since the last refresh, this workflow uploads the
# TUF-verified bundle as an artifact and opens or updates ONE issue. A
# maintainer spot-checks it and commits it in a normal pull request.
#
# AST08 defense: tag-pinned actions throughout. SHAs verified via
# git ls-remote pattern from session 5 + B.10 sweep.

on:
  schedule:
    # Weekly Monday 06:00 UTC. Stays clear of typical PR-merge windows.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Install cosign (same pin as release-sign.yml's E.06)
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
        with:
          cosign-release: 'v2.4.3'

      - name: Download latest Sigstore trust root (TUF-verified)
        # SECURITY: tuf-repo-cdn.sigstore.dev now serves TUF
        # consistent-snapshot targets, so `targets/trusted_root.json` no
        # longer exists as a static path -- targets are only published
        # content-addressed as `targets/<sha256-of-file>.trusted_root.json`.
        #
        # A prior version of this step worked around that by curling
        # `trusted_root.json` from `sigstore/root-signing`'s `main` branch
        # directly, with NO verification. That defeats the entire point of
        # a trust root: `main` is a mutable ref, so a compromised branch
        # (or a compromised/MITM'd raw.githubusercontent.com response)
        # would inject a forged root, and every downstream signature check
        # in this repo (skill signing included) would then trust forged
        # signatures. Flagged by automated security review before merge --
        # do not reintroduce an unverified fetch here.
        #
        # Correct fix: `cosign initialize` performs full TUF client
        # verification (root -> timestamp -> snapshot -> targets, each
        # signature-checked against cosign's embedded Sigstore root of
        # trust) and caches the verified, current targets locally --
        # including trusted_root.json -- so we never hand-roll TUF
        # ourselves or trust an unverified fetch.
        run: |
          set -euo pipefail
          cosign initialize

          FOUND="$(find "$HOME/.sigstore" -type f -name 'trusted_root.json' -print -quit)"
          if [[ -z "$FOUND" ]]; then
            echo "FAIL: cosign initialize did not produce a trusted_root.json under \$HOME/.sigstore -- refusing to write an unverified/missing trust bundle." >&2
            exit 1
          fi
          if [[ ! -s "$FOUND" ]]; then
            echo "FAIL: $FOUND exists but is empty." >&2
            exit 1
          fi

          mkdir -p .workflow/sigstore
          cp "$FOUND" .workflow/sigstore/trust-bundle.json
          echo "Trust bundle refreshed from TUF-verified $FOUND"

      - name: Check for drift
        id: drift
        run: |
          set -euo pipefail
          # An untracked bundle counts as a change: `git diff` alone ignores untracked files, which
          # left this check reporting "unchanged" while no bundle was committed at all.
          if git ls-files --error-unmatch .workflow/sigstore/trust-bundle.json >/dev/null 2>&1 \
            && git diff --quiet -- .workflow/sigstore/trust-bundle.json; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            echo "Trust bundle unchanged -- nothing to report."
          else
            echo "no_change=false" >> "$GITHUB_OUTPUT"
            echo "Trust bundle changed -- reporting it in an issue."
          fi

      - name: Upload the refreshed trust bundle
        if: steps.drift.outputs.no_change == 'false'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: trust-bundle-${{ github.run_id }}
          path: .workflow/sigstore/trust-bundle.json
          retention-days: 30

      - name: Open or update the trust-bundle issue
        if: steps.drift.outputs.no_change == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='Sigstore trust bundle changed'
          new_sha=$(sha256sum .workflow/sigstore/trust-bundle.json | cut -d' ' -f1)
          if git cat-file -e HEAD:.workflow/sigstore/trust-bundle.json 2>/dev/null; then
            old_sha=$(git show HEAD:.workflow/sigstore/trust-bundle.json | sha256sum | cut -d' ' -f1)
          else
            old_sha='none (no bundle is committed)'
          fi
          if [ "$old_sha" = 'none (no bundle is committed)' ]; then
            headline="No trust bundle is committed yet. The weekly refresh fetched one with \`cosign initialize\` (full TUF verification)."
          else
            headline="The weekly refresh found a new Sigstore trust root (fetched with \`cosign initialize\`, full TUF verification)."
          fi
          body=$(printf '%s\n' \
            "$headline" \
            "" \
            "- committed bundle sha256: \`$old_sha\`" \
            "- refreshed bundle sha256: \`$new_sha\`" \
            "- artifact: $RUN_URL (\`trust-bundle-*\`, kept 30 days)" \
            "" \
            "To apply it: run \`cosign initialize\` locally, copy the resulting \`trusted_root.json\` to \`.workflow/sigstore/trust-bundle.json\`, check that its sha256 matches the one above, and open a normal pull request. No bot opens branches in this repository.")
          # Only issues this workflow opened (author app/github-actions), checked in jq: `--app` and
          # `--author` go through search, which does not match this bot's issues.
          number=$(gh issue list --state open --limit 100 --json number,title,author --jq ".[] | select(.title == \"$title\" and .author.login == \"app/github-actions\" and .author.is_bot) | .number" | head -1)
          if [ -n "$number" ]; then gh issue edit "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Close the trust-bundle issue when nothing changed
        if: steps.drift.outputs.no_change == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Sigstore trust bundle changed'
          number=$(gh issue list --state open --limit 100 --json number,title,author --jq ".[] | select(.title == \"$title\" and .author.login == \"app/github-actions\" and .author.is_bot) | .number" | head -1)
          if [ -n "$number" ]; then gh issue close "$number" --comment "The committed trust bundle matches the current Sigstore root."; fi
