name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

# All `uses:` actions in this workflow are SHA-pinned per REQ-B8 / AC-B8.1
# (AST08 defense -- a malicious tag move on an upstream action would
# otherwise compromise the security-scan layer itself). SHAs verified via
# `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` at
# pin time (B.10 sweep, session 6). When upgrading an action, look up the
# new tag's SHA and replace; do NOT use a tag reference.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action's ScanPullRequest enumerates PR commits via the GitHub
    # API, which requires pull-requests:read (the 403 error's
    # x-accepted-github-permissions header names exactly this). The default
    # PR token doesn't grant it, so declare the minimal scope explicitly.
    # Comments stay disabled (below) so no pull-requests:write is needed.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dedicated CI-only config (governance/gitleaks-ci.toml), NOT
          # governance/gitleaks-tier3.toml and NOT a root .gitleaks.toml --
          # see that file's header comment for why each of those would
          # widen this allowlist's scope beyond intent. gitleaks-action
          # honors GITLEAKS_CONFIG as an explicit --config-equivalent path.
          GITLEAKS_CONFIG: governance/gitleaks-ci.toml
          # The root .gitleaksignore baselines the deliberate test fixtures the
          # scheduled full-history scan reports, by exact fingerprint. Those
          # fingerprints depend on the gitleaks version, so the version the
          # action already defaults to is pinned here explicitly; bump it only
          # together with a regenerated .gitleaksignore
          # (specs/security/history-secret-scan-baseline.md).
          GITLEAKS_VERSION: "8.24.3"
          # gitleaks-action posts a PR comment by default. On pull_request events
          # the default GITHUB_TOKEN is read-only, so the comment POST returns
          # 403 "Resource not accessible by integration" and fails the job —
          # surfaced once billing let CI run on PRs again (Session 16). Disabling
          # comments keeps the token minimal-permission (no pull-requests:write
          # needed); the scan still runs and the check status still gates on any
          # real secret leak. Findings are visible in the job log + check result.
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    # The deprecated returntocorp/semgrep-action bundled a Semgrep that crashed on the
    # registry packs' MEDIUM severity ("ValueError: invalid rule severity value") and
    # still reported success, so this check scanned nothing for weeks. Run a pinned
    # current Semgrep directly; fail on findings, on fatal errors, and on an empty scan.
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.167.0@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Semgrep (owasp-top-ten, r2c-security-audit, secrets)
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config p/owasp-top-ten --config p/r2c-security-audit --config p/secrets \
            --metrics=off --error --json --output semgrep.json . || rc=$?
          rc=${rc:-0}
          python3 - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          d = json.load(open("semgrep.json"))
          scanned = len(d.get("paths", {}).get("scanned", []))
          fatal = [e for e in d.get("errors", []) if str(e.get("level", "")).lower() not in ("warn", "warning", "info")]
          print(f"semgrep: exit {rc}, {scanned} files scanned, {len(d.get('results', []))} findings, {len(d.get('errors', []))} errors ({len(fatal)} fatal)")
          for r in d.get("results", []):
              print(f"FINDING {r['extra'].get('severity')} {r['check_id']} {r['path']}:{r['start']['line']}")
          for e in fatal:
              print(f"ERROR {e.get('type')} {str(e.get('message'))[:200]}")
          if scanned == 0:
              sys.exit("semgrep scanned no files: refusing to report a pass")
          if fatal:
              sys.exit("semgrep reported fatal errors")
          sys.exit(rc)
          PY

  # ---------------------------------------------------------------------
  # DeepTeam OWASP_ASI_2026() red-team gate (spec phase-2/B-deepteam-ci.md).
  # All `uses:` here SHA-pinned per REQ-B8 / AST08 defense.
  # ---------------------------------------------------------------------
  deepteam:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # NFR-B1 hard wall-clock cap (ASI07 defense)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0  # need base for changed-files diff in path filter

      # REQ-B1: On pull_request, only run if changed files include any path
      # under the 7 agent-behavior globs. On push to main, REQ-B2 backstop
      # runs unconditionally (no path filter).
      - id: path-filter
        name: REQ-B1 path filter (agent-behavior PRs only; push-to-main bypasses)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            CHANGED="$(git diff --name-only "${BASE_SHA}" HEAD || echo '')"
            AGENT_PATTERN='^(skills/|hooks/|subagents/|constitution/|mcp-configs/|analyzer/|governance/owasp-asi-2026/)'
            if echo "$CHANGED" | grep -qE "$AGENT_PATTERN"; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "REQ-B1 trigger: matched agent-behavior paths in PR diff"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "REQ-B1 skip: docs-only / dep-bump / refactor PR (AC-B1.2)"
            fi
          else
            # push to main, schedule, etc. -- REQ-B2 backstop, always run
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "REQ-B2 trigger: ${{ github.event_name }} event"
          fi

      - name: Setup Python
        if: steps.path-filter.outputs.should_run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install DeepTeam
        if: steps.path-filter.outputs.should_run == 'true'
        # Use `python3 -m pip install`, not bare `pip install`: actions/setup-python
        # updates PATH for this job, but a bare `pip` name can still resolve to a
        # different pip shim (e.g. a runner-image system pip) than the `python3`
        # the next step imports against, so the install silently lands in the
        # wrong site-packages even though the step reports success. `python3 -m
        # pip` pins the install to the exact interpreter used by the pre-flight
        # `python3 -c "import deepteam"` check in scripts/run-redteam.sh.
        # (No setup-python `cache:` key is set here and there's a single
        # python-version across both steps in this job, so this isn't a
        # cache-staleness or version-drift issue -- it's pip/python3 PATH
        # divergence.)
        run: python3 -m pip install deepteam

      - name: Run DeepTeam OWASP_ASI_2026 red-team
        if: steps.path-filter.outputs.should_run == 'true'
        id: redteam
        # Critical-severity exit gate (REQ-B3) is inherited from the script:
        # scripts/run-redteam.sh exits 1 on >=1 critical finding, 2 on
        # budget brake (REQ-B5), 0 otherwise. GitHub Actions fails the
        # step on non-zero exit and fails this job. That job is not a required
        # status check on main (required: validate, stratum-test, setup-linux,
        # gitleaks, semgrep), and without a provider key the script skips,
        # so today it gates nothing (masterpiece roadmap MR-7).
        run: bash scripts/run-redteam.sh

      # REQ-B4 medium/low surfacing -- non-blocking PR comment.
      # `always()` ensures this step runs even after the prior step's
      # non-zero exit (REQ-B3 critical-fail OR REQ-B5 budget-brake), so
      # surfacing information always reaches the PR. The step itself
      # exits 0 (med/low surfacing is non-blocking by REQ-B4 design).
      - name: Surface med/low findings on PR (REQ-B4 non-blocking)
        if: ${{ always() && steps.path-filter.outputs.should_run == 'true' && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ -f .workflow/proofs/red-team/findings.jsonl ]; then
            MED_LOW=$(grep -cE '"severity":\s*"(medium|low)"' .workflow/proofs/red-team/findings.jsonl || echo 0)
            echo "Red-team scan: ${MED_LOW} medium/low finding(s) (non-blocking)."
            echo "Detailed report uploaded as artifact deepteam-${{ github.run_id }} (90d retention)."
          fi
          if [ -f .workflow/proofs/red-team/budget-exhausted.md ]; then
            echo "WARNING: budget brake fired -- see uploaded budget-exhausted.md artifact (REQ-B5)."
          fi
        # Explicit exit 0 -- REQ-B4 mandates med/low surfacing is non-blocking
        continue-on-error: false  # this step itself does not fail the workflow

      # REQ-B6 artifact upload. Includes report.md + findings.jsonl +
      # (when REQ-B5 brake fired) budget-exhausted.md. 90-day retention
      # per spec B Decisions. `always()` ensures uploads happen even on
      # REQ-B3 critical-fail or REQ-B5 budget-brake exit.
      - name: Upload deepteam artifacts (REQ-B6 / REQ-B5)
        if: ${{ always() && steps.path-filter.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: deepteam-${{ github.run_id }}
          path: .workflow/proofs/red-team/
          retention-days: 90
          if-no-files-found: warn
