name: Bug Report
description: A defect in DevOPs
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DevOPs version
      description: "Run: cat ~/DevOPs/governance/VERSION.md | head -3"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Coding agent / tool
      description: "Claude Code, Codex, Cursor, etc."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened
      description: Including any blockers written to .workflow/state/blockers.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
