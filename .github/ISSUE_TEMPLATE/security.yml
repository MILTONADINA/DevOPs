name: Security
description: For non-sensitive security improvements ONLY. Report vulnerabilities through GitHub private vulnerability reporting.
title: "[Security] "
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **DO NOT FILE THIS FORM FOR VULNERABILITIES.**
        Report vulnerabilities through GitHub private vulnerability reporting:
        https://github.com/MILTONADINA/DevOPs/security/advisories/new
        See `docs/SECURITY.md`.
        This form is for non-sensitive security improvements only.
  - type: textarea
    id: improvement
    attributes:
      label: Security improvement proposal
