version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions-all:
        patterns:
          - "*"

  # ── Root npm package ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary
    groups:
      npm-root:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Runtime npm package ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary
    # Held versions, checked by tests/dependency-updates.test.mjs; lift a hold there first.
    ignore:
      # typescript-eslint 8.56 and later need Node ^22.13; the runtime supports >=22.12.0.
      - dependency-name: "@typescript-eslint/eslint-plugin"
        versions: [">8.55.0"]
      - dependency-name: "@typescript-eslint/parser"
        versions: [">8.55.0"]
      # Must match the exact pin in @huggingface/transformers; it moves with transformers.
      - dependency-name: "onnxruntime-node"
    groups:
      npm-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
